name: Add Release to Sentry

on:
  push:
    tags:
      - '*'

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  sentry_release:
    # torii: este workflow publicaba la release en el Sentry de ppy (org ppy, proyecto osu) con un token
    # que este fork no tiene ni deberia tener. Ni siquiera queremos que ande: seria mandar nuestra
    # telemetria a la infra de ellos. Se deja el archivo para no conflictuar al sincronizar con upstream,
    # pero queda deshabilitado de forma incondicional (if: false) y sin ninguna referencia a sentry.ppy.sh.
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create Sentry release
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ppy
          SENTRY_PROJECT: osu
        with:
          environment: production
          version: osu@${{ github.ref_name }}
